<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>EAS Configuration</title>
        <link rel="icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/style.css" />
        <link rel="stylesheet" href="/config-form.css" />
    </head>
    <body>
        <header>
            <h1><img src="assets/favicon-96x96.png" alt="EAS Logo" class="logo" />EAS Configuration</h1>
            <div id="header-right">
                <div id="logout-container">
                    <a class="custom-button" href="/index.html">Back to Dashboard</a>
                    <a class="custom-button" href="#" id="logoutLink">Logout</a>
                </div>
            </div>
        </header>
        <main class="cfg-page" id="configPage">
            <aside class="cfg-sidebar">
                <input type="search" id="cfgSearch" class="cfg-input cfg-search" placeholder="Find a setting" aria-label="Find a setting" />
                <label class="cfg-toggle"><input type="checkbox" id="cfgOnlySet" /> Only what config.json sets</label>
                <div class="cfg-view-switch" role="group" aria-label="View">
                    <button type="button" id="viewForm" aria-pressed="true">Form</button>
                    <button type="button" id="viewJson" aria-pressed="false">JSON</button>
                </div>
                <nav class="cfg-nav" id="cfgNav" aria-label="Sections"></nav>
            </aside>
            <div class="cfg-content">
                <p class="cfg-intro" id="cfgIntro">Loading the configuration...</p>
                <div id="cfgForm" class="cfg-content"></div>
                <div id="cfgJson" hidden>
                    <textarea id="configEditor" spellcheck="false" aria-label="config.json contents"></textarea>
                </div>
            </div>
        </main>
        <div class="cfg-actionbar">
            <div id="configStatus" class="config-status" role="status" hidden></div>
            <div class="cfg-actionbar-row">
                <span id="cfgDirty" class="cfg-dirty">No unsaved changes</span>
                <button type="button" class="custom-button" id="validateButton">Validate</button>
                <button type="button" class="custom-button" id="revertButton">Discard changes</button>
                <button type="button" class="custom-button" id="saveButton">Save</button>
                <button type="button" class="custom-button cfg-primary" id="saveReloadButton">Save &amp; Reload</button>
            </div>
            <details class="cfg-changes" id="cfgChanges" hidden>
                <summary>Review changes</summary>
                <ul id="cfgChangeList"></ul>
            </details>
        </div>
        <script>window.API_BASE = window.location.host;</script>
        <script src="shared.js"></script>
        <script src="config-form.js"></script>
        <script src="notifications.js"></script>
        <script src="uninstall.js"></script>
        <script src="config.js"></script>
    </body>
</html>
