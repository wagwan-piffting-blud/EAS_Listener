name: Docker Image CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: eas-listener
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      image_id: ${{ steps.meta.outputs.image_id }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Compute build matrix
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'matrix={"include":[{"variant":"full","platform":"linux/amd64","arch":"amd64","runner":"ubuntu-24.04"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"variant":"full","platform":"linux/amd64","arch":"amd64","runner":"ubuntu-24.04"},{"variant":"full","platform":"linux/arm64","arch":"arm64","runner":"ubuntu-24.04-arm"},{"variant":"full","platform":"linux/arm/v7","arch":"armv7","runner":"ubuntu-24.04"},{"variant":"lite","platform":"linux/amd64","arch":"amd64","runner":"ubuntu-24.04"}]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image id and version
        id: meta
        run: |
          IMAGE_ID=${{ env.REGISTRY }}/${{ github.repository_owner }}/$IMAGE_NAME
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          [ "$VERSION" == "main" ] && VERSION=latest
          echo "image_id=${IMAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Run test suite
        run: cargo test --release --locked

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VARIANT=${{ matrix.variant }}
          labels: runnumber=${{ github.run_id }}
          provenance: false
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.setup.outputs.image_id) || 'type=cacheonly' }}
          cache-from: type=registry,ref=${{ needs.setup.outputs.image_id }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1}-{2},mode=max,compression=zstd,image-manifest=true,oci-mediatypes=true', needs.setup.outputs.image_id, matrix.variant, matrix.arch) || '' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: [setup, test, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            tag_suffix: ""
          - variant: lite
            tag_suffix: "-lite"
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAG='${{ needs.setup.outputs.image_id }}:${{ needs.setup.outputs.version }}${{ matrix.tag_suffix }}'
          docker buildx imagetools create -t "$TAG" \
            $(printf '${{ needs.setup.outputs.image_id }}@sha256:%s ' *)
          docker buildx imagetools inspect "$TAG"
