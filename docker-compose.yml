services:
    eas_listener:
        image: ghcr.io/wagwan-piffting-blud/eas-listener:latest # Multi-arch (amd64, arm64, armv7). Piper and espeak-ng are in the image; Speechify Tom, Cepstral Swift 6.2 and Loquendo 6.9 Dave are downloaded to /data on the first boot that selects them. Pick one with TTS_ENGINE in config.json; leave it unset to use Speechify. The "latest-lite" tag is DEPRECATED and will stop being published after v0.32.0 -- see the README for the one-line migration.
        container_name: eas_listener
        restart: unless-stopped
        volumes:
            - ./data:/data
            - ./apprise.yml:/app/apprise.yml
            # - ./leadin.mp3:/app/leadin.mp3         # Include if you have lead-in audio and want to use it when relaying
            # - ./leadout.mp3:/app/leadout.mp3       # Include if you have lead-out audio and want to use it when relaying
            - ./config.json:/app/config.json
            # - ./cap_tts_replacement_config.json:/app/cap_tts_replacement_config.json # Include if you have a TTS replacement config for CAP alerts and want to use it
        env_file:
            - .env
        ports:
            - "${MONITORING_BIND_PORT}:${MONITORING_BIND_PORT}"
            # - "${ICECAST_ALERT_PORT:-8000}:${ICECAST_ALERT_PORT:-8000}" # Uncomment to publish the 24/7 alert stream, which the listener serves itself (ICECAST_ALERT_STREAM_ENABLED=true in config.json). Change the port via ICECAST_ALERT_PORT, set the SAME in both .env and config.json
